<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- the brand image: source of public/og.png and docs/brand/*.png. edit it, then run `pnpm brand:images` (scripts/brand-images.mjs),
       which renders it in chromium with Inter, dark and light (add class="light" to the svg). colours mirror src/index.css -->
  <style>
    svg { --bg: #0a0f1c; --fg: #e8ecf4; --card: #111827; --pop: #131c2e; --primary: #fb7a3c; --on-primary: #1b0d05;
          --muted: #9aa6ba; --border: #1f2a3d; --input: #2a3750; --tint: rgb(251 122 60 / 0.15); --grid: 0.07; --glow: 0.22; --shadow: 0.5 }
    svg.light { --bg: #f7f8fb; --fg: #0f172a; --card: #ffffff; --pop: #ffffff; --primary: #c2410c; --on-primary: #fff7ed;
          --muted: #4b5568; --border: #e2e6ee; --input: #d5dbe5; --tint: rgb(194 65 12 / 0.1); --grid: 0.06; --glow: 0.14; --shadow: 0.12 }
    text { font-family: Inter, sans-serif; fill: var(--fg) }
    .muted { fill: var(--muted) }
    .primary { fill: var(--primary) }
  </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" style="stroke: var(--primary); stroke-opacity: var(--grid)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75">
      <stop offset="0" style="stop-color: var(--primary); stop-opacity: var(--glow)"/>
      <stop offset="1" style="stop-color: var(--primary); stop-opacity: 0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" style="flood-color: #000; flood-opacity: var(--shadow)"/>
    </filter>
    <!-- the crest from the site header; the inner shape takes the colour of whatever it sits on -->
    <symbol id="crest" viewBox="0 0 32 32">
      <path d="M16 1.5 28 5.5v9.2c0 7.4-5 12.9-12 15.8C9 27.6 4 22.1 4 14.7V5.5z" class="primary"/>
      <path d="M8.5 12.5v-3h2.6v1.6h2.2V9.5h5.4v1.6h2.2V9.5h2.6v3z M8.5 13.5h15v6.8c0 3.6-3.3 6.6-7.5 8.2-4.2-1.6-7.5-4.6-7.5-8.2z" fill="currentColor"/>
      <circle cx="16" cy="18" r="2" class="primary"/>
      <path d="M15 19h2l.7 4.5h-3.4z" class="primary"/>
    </symbol>
    <symbol id="check" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="13" style="fill: var(--tint)"/>
      <path d="M7.5 13.5l3.6 3.6 7.4-7.6" fill="none" style="stroke: var(--primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- backgrounds overshoot the canvas so wider crops (1280×640) never show an edge -->
  <rect x="-200" y="-200" width="1600" height="1030" style="fill: var(--bg)"/>
  <rect x="-200" y="-200" width="1600" height="1030" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- left: who it is and what it does -->
  <use href="#crest" x="96" y="70" width="56" height="56" style="color: var(--bg)"/>
  <text x="166" y="112" font-weight="700" font-size="34" letter-spacing="0.5">CKAuth</text>

  <text x="96" y="264" font-weight="800" font-size="70" letter-spacing="-1.5">Every sign-in,</text>
  <text x="96" y="344" font-weight="800" font-size="70" letter-spacing="-1.5" class="primary">guarded.</text>

  <use href="#check" x="96" y="400" width="28" height="28"/>
  <text x="140" y="423" font-size="26" font-weight="500">Email-confirmed sign-ups</text>
  <use href="#check" x="96" y="448" width="28" height="28"/>
  <text x="140" y="471" font-size="26" font-weight="500">Password guessing blocked</text>
  <use href="#check" x="96" y="496" width="28" height="28"/>
  <text x="140" y="519" font-size="26" font-weight="500">New-device alerts</text>

  <text x="96" y="584" font-size="24" font-weight="600" class="muted">ckauth.chiragdev.com · free during early access</text>

  <!-- right: the product itself, a sign-in card and the alert it sends -->
  <g transform="translate(724 64)" filter="url(#lift)">
    <rect width="380" height="400" rx="24" style="fill: var(--card); stroke: var(--border)" stroke-width="2"/>
    <use href="#crest" x="170" y="30" width="40" height="40" style="color: var(--card)"/>
    <text x="190" y="110" text-anchor="middle" font-size="26" font-weight="700">Welcome back</text>

    <text x="32" y="152" font-size="17" font-weight="500" class="muted">Email</text>
    <rect x="32" y="162" width="316" height="50" rx="12" style="fill: var(--bg); stroke: var(--input)" stroke-width="2"/>
    <text x="50" y="194" font-size="19">you@yourshop.com</text>

    <text x="32" y="242" font-size="17" font-weight="500" class="muted">Password</text>
    <rect x="32" y="252" width="316" height="50" rx="12" style="fill: var(--bg); stroke: var(--input)" stroke-width="2"/>
    <text x="50" y="285" font-size="22" letter-spacing="3">••••••••••</text>

    <rect x="32" y="324" width="316" height="52" rx="26" class="primary"/>
    <text x="190" y="357" text-anchor="middle" font-size="20" font-weight="700" style="fill: var(--on-primary)">Sign in</text>
  </g>

  <g transform="translate(652 444)" filter="url(#lift)">
    <rect width="372" height="96" rx="20" style="fill: var(--pop); stroke: var(--border)" stroke-width="2"/>
    <circle cx="50" cy="48" r="26" style="fill: var(--tint)"/>
    <g transform="translate(38 36)" fill="none" style="stroke: var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </g>
    <text x="92" y="42" font-size="21" font-weight="700">New device signed in</text>
    <text x="92" y="70" font-size="18" class="muted">We emailed you right away</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- the app icon and social avatar: the crest on the brand background. full-bleed, because ios, android and social sites
       cut their own shape (rounded square, circle); the crest stays inside the centre 80% circle, the maskable-icon safe zone.
       rendered by `pnpm brand:images` (scripts/brand-images.mjs); colours mirror src/index.css, class="light" for the day theme -->
  <style>
    svg { --bg: #0a0f1c; --primary: #fb7a3c; --grid: 0.07; --glow: 0.3 }
    svg.light { --bg: #f7f8fb; --primary: #c2410c; --grid: 0.06; --glow: 0.16 }
    .primary { fill: var(--primary) }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M32 0H0V32" fill="none" style="stroke: var(--primary); stroke-opacity: var(--grid)" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--primary); stop-opacity: var(--glow)"/>
      <stop offset="1" style="stop-color: var(--primary); stop-opacity: 0"/>
    </radialGradient>
    <symbol id="crest" viewBox="0 0 32 32">
      <path d="M16 1.5 28 5.5v9.2c0 7.4-5 12.9-12 15.8C9 27.6 4 22.1 4 14.7V5.5z" class="primary"/>
      <path d="M8.5 12.5v-3h2.6v1.6h2.2V9.5h5.4v1.6h2.2V9.5h2.6v3z M8.5 13.5h15v6.8c0 3.6-3.3 6.6-7.5 8.2-4.2-1.6-7.5-4.6-7.5-8.2z" style="fill: var(--bg)"/>
      <circle cx="16" cy="18" r="2" class="primary"/>
      <path d="M15 19h2l.7 4.5h-3.4z" class="primary"/>
    </symbol>
  </defs>
  <rect width="512" height="512" style="fill: var(--bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <use href="#crest" x="98" y="98" width="316" height="316"/>
</svg>
